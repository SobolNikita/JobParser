<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Перенаправление // JobParser</title>
  <script>
    // GitHub Pages 404 fallback: redirect to /JobParser/ preserving query parameters and hash
    (function() {
      var currentUrl = new URL(window.location.href);
      var targetUrl = '/JobParser/' + currentUrl.search + currentUrl.hash;
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #ededed; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
  <div>
    <div style="width: 24px; height: 24px; border: 2px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
    <p style="font-size: 14px; color: #888;">Загрузка веб-панели JobParser...</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
